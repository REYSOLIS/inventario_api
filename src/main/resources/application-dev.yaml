spring:
  application:
    name: inventario-api

  datasource:
    url: jdbc:mariadb://localhost:3306/inventario_activos
    username: root
    password: 123456
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: "inventario-activos-tecnologicos-jwt-secret-key-2026-admin-user"
  expiration: 86400000
